[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "syntax-annotation-visualizer"
version = "0.1.0"
description = "Web application for visualizing pre-existing syntactic annotation of Russian text"
requires-python = ">=3.10"
dependencies = [
  "Flask>=3.0,<4.0",
  "jsonschema>=4.20,<5.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
