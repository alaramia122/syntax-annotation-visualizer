name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Validate JSON Schema
        run: python -c "import json; from jsonschema import Draft202012Validator; s=json.load(open('schemas/annotation.schema.json', encoding='utf-8')); Draft202012Validator.check_schema(s); print('JSON Schema syntax OK')"
      - name: Run tests
        run: python -m pytest -q
